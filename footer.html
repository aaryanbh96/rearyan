<!-- Footer Styles -->
<style>
    /* Footer */
    .footer {
        padding: 4rem 0 2rem;
        background: #000000;
        border-top: 1px solid #2a2a2a;
    }

    .footer-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        gap: 3rem;
    }

    .footer-left {
        display: flex;
        align-items: center;
        gap: 3rem;
    }

    .follow-text {
        font-size: 1.5rem;
        font-weight: 500;
    }

    .social-icons {
        display: flex;
        gap: 1.5rem;
    }

    .social-icon {
        width: 60px;
        height: 60px;
        background: transparent;
        border: 2px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        text-decoration: none;
        transition: all 0.3s ease;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 500;
        font-size: 1rem;
        overflow: hidden;
    }

    .social-icon img {
        width: 24px;
        height: 24px;
        filter: invert(1);
        transition: all 0.3s ease;
    }

    .social-icon:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #cccccc;
    }

    .social-icon:hover img {
        filter: invert(0.8);
    }

    .back-to-top {
        background: transparent;
        border: 1px solid #333333;
        color: #ffffff;
        padding: 1rem 2rem;
        font-family: 'Space Grotesk', sans-serif;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .back-to-top:hover {
        border-color: #666666;
        background: rgba(255, 255, 255, 0.05);
    }

    .copyright {
        text-align: center;
        color: #666666;
        font-size: 0.9rem;
        margin-top: 2rem;
    }

    /* Footer Container - match main site container */
    .footer .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .footer-content {
            flex-direction: column;
            gap: 2rem;
            justify-content: center;
        }
        
        .footer-left {
            flex-direction: column;
            gap: 2rem;
        }
    }
</style>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <div class="footer-content">
            <div class="footer-left">
                <div class="follow-text">Follow Along</div>
                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/aaryanb/" class="social-icon" target="_blank" rel="noopener noreferrer">
                        <img src="assets/images/icons/linkedin.png" alt="LinkedIn">
                    </a>
                    <a href="https://github.com/aaryanbh96" class="social-icon" target="_blank" rel="noopener noreferrer">
                        <img src="assets/images/icons/github.png" alt="GitHub">
                    </a>
                    <a href="mailto:ab@rearyan.com" class="social-icon">
                        <img src="assets/images/icons/email.png" alt="Email">
                    </a>
                    <a href="https://x.com/aryanb_or" class="social-icon" target="_blank" rel="noopener noreferrer">
                        <img src="assets/images/icons/twitter.png" alt="Twitter">
                    </a>
                </div>
            </div>
            <button class="back-to-top" onclick="scrollToTop()">↑ Back to Top</button>
        </div>
        <div class="copyright">
            © 2025 Aryan Bhardwaj
        </div>
    </div>
</footer>

<!-- Footer JavaScript -->
<script>
    // Scroll to top function
    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    // Smooth scrolling for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                target.scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }
        });
    });
</script>
