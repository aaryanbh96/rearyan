<!-- Header Styles -->
<style>
    /* Logo & Navigation - Transparent on scroll */
    .logo {
        position: fixed;
        left: 2rem;
        top: 2rem;
        z-index: 1000;
        font-family: 'JetBrains Mono', monospace;
        font-size: 1.5rem;
        font-weight: 500;
        color: #ffffff;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .logo:hover {
        opacity: 0.7;
    }

    .logo.scrolled {
        opacity: 0.1;
    }

    /* Navigation */
    .nav-sidebar {
        position: fixed;
        right: 2rem;
        top: 2rem;
        z-index: 1000;
        display: flex;
        flex-direction: row;
        gap: 2rem;
        align-items: center;
        transition: all 0.3s ease;
    }

    .nav-sidebar.scrolled {
        opacity: 0.1;
    }

    .nav-btn {
        background: transparent;
        border: none;
        color: #ffffff;
        padding: 0.75rem 1.5rem;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 0.9rem;
        font-weight: 400;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
        letter-spacing: 0.05em;
    }

    .nav-btn:hover {
        color: #cccccc;
    }

    .nav-btn.highlight {
        border: 2px solid #ffffff;
        background: rgba(255, 255, 255, 0.1);
        padding: 0.75rem 1.5rem;
    }

    .nav-btn.highlight:hover {
        border-color: #cccccc;
        color: #ffffff;
    }

    /* Responsive Design */
    @media (max-width: 1024px) {
        .nav-sidebar {
            right: 1rem;
            gap: 1rem;
        }

        .nav-btn {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }
    }

    @media (max-width: 768px) {
        .nav-sidebar {
            flex-direction: column;
            gap: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .logo {
            left: 1rem;
            font-size: 1.2rem;
        }
    }
</style>

<!-- Logo -->
<a href="index.html" class="logo">re:aryan</a>

<!-- Navigation Sidebar -->
<nav class="nav-sidebar" id="mainNav">
    <a href="projects.html" class="nav-btn">Selected Work</a>
    <a href="resume.html" class="nav-btn">Resume</a>
    <a href="future.html" class="nav-btn">On Future/Space</a>
    <a href="bookshelf.html" class="nav-btn">Bookshelf</a>
    <a href="index.html#contact" class="nav-btn highlight">Get in Touch</a>
</nav>

<!-- Header JavaScript -->
<script>
    // Header transparency on scroll
    window.addEventListener('scroll', function() {
        const logo = document.querySelector('.logo');
        const nav = document.querySelector('.nav-sidebar');
        const scrollY = window.pageYOffset || document.documentElement.scrollTop;
        
        if (scrollY > 100) {
            logo.classList.add('scrolled');
            nav.classList.add('scrolled');
        } else {
            logo.classList.remove('scrolled');
            nav.classList.remove('scrolled');
        }
    });

    // Highlight current page in navigation
    function highlightCurrentPage() {
        const currentPage = window.location.pathname.split('/').pop();
        const navLinks = document.querySelectorAll('.nav-btn');
        
        // Remove highlight class from Get in Touch
        navLinks.forEach(link => {
            if (link.getAttribute('href').includes('#contact')) {
                link.classList.remove('highlight');
            }
        });
        
        // Add highlight to current page
        navLinks.forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage || 
                (currentPage === 'index.html' && href.includes('#contact')) ||
                (currentPage === '' && href.includes('#contact'))) {
                link.classList.add('highlight');
            } else if (href === currentPage) {
                link.classList.add('highlight');
            }
        });
    }

    // Run when page loads
    document.addEventListener('DOMContentLoaded', highlightCurrentPage);
</script>
